<!DOCTYPE html>
<html lang="vi" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tư vấn chọn tổ hợp theo năng lực học tập</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            padding-bottom: 60px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .DiemTHCS, .DiemTHCS2, .chart-container {
            padding: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            color: #333;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
        }
        .DiemTHCS table, .DiemTHCS2 table {
            width: 100%;
            border-collapse: collapse;
        }
        .DiemTHCS th, .DiemTHCS td {
            padding: 8px 5px;
            border: 1px solid #ddd;
            text-align: center;
        }
        .display-box {
            font-family: 'Orbitron', sans-serif;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            color: #495057;
            border-radius: 4px;
            width: 100%;
            height: 35px;
            text-align: center;
            box-sizing: border-box;
            padding: 0 5px;
        }
        .display-title {
            font-family: 'Orbitron', sans-serif;
            background-color: #87CEFA;
            border: 1px solid #ced4da;
            color: #333;
            border-radius: 4px;
            width: 100%;
            height: 35px;
            text-align: left;
            padding-left: 5px;
            box-sizing: border-box;
            font-weight: bold;
        }
        .display-title2 {
            font-family: 'Orbitron', sans-serif;
            background-color: #87CEFA;
            border: 1px solid #ced4da;
            color: #333;
            border-radius: 4px;
            width: 100%;
            height: 35px;
            text-align: center;
            box-sizing: border-box;
            font-weight: bold;
        }
        .button {
            font-family: sans-serif;
            background-color: #007bff;
            color: white;
            border: none;
            width: 100%;
            border-radius: 4px;
            height: 40px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .button:active {
            background: #004085;
            box-shadow: inset 0px 0px 5px rgba(0, 0, 0, 0.2);
        }
        #excelFile {
            display: none;
        }
        label[for="excelFile"] {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        label[for="excelFile"]:hover {
            background-color: #5a6268;
        }
        #fileName {
            font-style: italic;
            color: #666;
            margin-left: 5px;
        }
        .button-download {
            background-color: #28a745;
        }
        .button-download:hover {
            background-color: #218838;
        }
        .button-clear {
            background-color: #dc3545;
        }
        .button-clear:hover {
            background-color: #c82333;
        }
        .result-container {
            width: 100%;
            height: 150px;
            overflow-y: auto;
            border: 1px solid #dae0e5;
            border-radius: 4px;
            background-color: #e2e6ea;
            padding: 10px;
            box-sizing: border-box;
        }
        .result-box {
            width: 100%;
            text-align: center;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: bold;
            white-space: pre-line;
            word-wrap: break-word;
        }
        .result-container::-webkit-scrollbar {
            width: 8px;
        }
        .result-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .result-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .result-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            z-index: 100;
        }
    </style>
</head>

    <input type="file" id="excelFile" accept=".xls,.xlsx,.csv"/>
    <script>
        let selectedFile;
        let abilityChart = null;

        // Danh sách ánh xạ trường dữ liệu dùng chung cho cả Đọc file và Tạo file mẫu
        const scoreFields = [
            { id: 'van6', key: 'Van6', sample: 7.5 }, { id: 'van7', key: 'Van7', sample: 7.8 }, { id: 'van8', key: 'Van8', sample: 8.0 }, { id: 'van9', key: 'Van9', sample: 8.2 },
            { id: 'toan6', key: 'Toan6', sample: 8.0 }, { id: 'toan7', key: 'Toan7', sample: 8.2 }, { id: 'toan8', key: 'Toan8', sample: 8.5 }, { id: 'toan9', key: 'Toan9', sample: 8.8 },
            { id: 'anh6', key: 'Anh6', sample: 7.0 }, { id: 'anh7', key: 'Anh7', sample: 7.2 }, { id: 'anh8', key: 'Anh8', sample: 7.5 }, { id: 'anh9', key: 'Anh9', sample: 7.8 },
            { id: 'gdcd6', key: 'GDCD6', sample: 8.0 }, { id: 'gdcd7', key: 'GDCD7', sample: 8.2 }, { id: 'gdcd8', key: 'GDCD8', sample: 8.5 }, { id: 'gdcd9', key: 'GDCD9', sample: 8.5 },
            { id: 'lsdl6', key: 'LSDL6', sample: 7.2 }, { id: 'lsdl7', key: 'LSDL7', sample: 7.5 }, { id: 'lsdl8', key: 'LSDL8', sample: 7.6 }, { id: 'lsdl9', key: 'LSDL9', sample: 7.8 },
            { id: 'khtn6', key: 'KHTN6', sample: 7.8 }, { id: 'khtn7', key: 'KHTN7', sample: 8.0 }, { id: 'khtn8', key: 'KHTN8', sample: 8.3 }, { id: 'khtn9', key: 'KHTN9', sample: 8.6 },
            { id: 'cn6', key: 'CongNghe6', sample: 8.0 }, { id: 'cn7', key: 'CongNghe7', sample: 8.1 }, { id: 'cn8', key: 'CongNghe8', sample: 8.2 }, { id: 'cn9', key: 'CongNghe9', sample: 8.4 },
            { id: 'th6', key: 'Tin6', sample: 8.5 }, { id: 'th7', key: 'Tin7', sample: 8.6 }, { id: 'th8', key: 'Tin8', sample: 8.8 }, { id: 'th9', key: 'Tin9', sample: 9.0 },
            { id: 'nghethuat6', key: 'NgheThuat6', sample: 8.0 }, { id: 'nghethuat7', key: 'NgheThuat7', sample: 8.0 }, { id: 'nghethuat8', key: 'NgheThuat8', sample: 8.5 }, { id: 'nghethuat9', key: 'NgheThuat9', sample: 8.5 },
            { id: 'hoatdong6', key: 'HoatDong6', sample: 8.5 }, { id: 'hoatdong7', key: 'HoatDong7', sample: 8.5 }, { id: 'hoatdong8', key: 'HoatDong8', sample: 9.0 }, { id: 'hoatdong9', key: 'HoatDong9', sample: 9.0 }
        ];

        // Tải file Excel mẫu (ưu tiên file tĩnh trong thư mục public/ trên GitHub/Vercel, dự phòng tự sinh bằng SheetJS)
        document.getElementById('downloadTemplate').addEventListener('click', async function () {
            const staticFilePath = './public/Mau_Bang_Diem_THCS.xlsx';

            try {
                const response = await fetch(staticFilePath, { method: 'HEAD' });
                if (response.ok) {
                    const link = document.createElement('a');
                    link.href = staticFilePath;
                    link.download = 'Mau_Bang_Diem_THCS.xlsx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    return;
                }
            } catch (e) {
                console.warn("Không thể kiểm tra file tĩnh, chuyển sang tự tạo file bằng SheetJS:", e);
            }

            if (typeof XLSX === 'undefined') {
                alert("Lỗi: Không tải được thư viện tạo file Excel. Vui lòng kiểm tra kết nối mạng và tải lại trang.");
                return;
            }

            try {
                const sampleRow = {};
                scoreFields.forEach(field => {
                    sampleRow[field.key] = field.sample;
                });

                const worksheet = XLSX.utils.json_to_sheet([sampleRow]);
                worksheet['!cols'] = scoreFields.map(field => ({
                    wch: Math.max(field.key.length + 3, 10)
                }));

                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "BangDiemMau");

                const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = "Mau_Bang_Diem_THCS.xlsx";
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            } catch (err) {
                alert("Có lỗi xảy ra khi tạo file mẫu: " + err.message);
            }
        });
        
        // Xử lý chọn file Excel
        document.getElementById('excelFile').addEventListener('change', function (e) {
            selectedFile = e.target.files[0];
            document.getElementById('fileName').textContent = selectedFile ? selectedFile.name : "Chưa chọn file nào";
        });
        
        document.getElementById('mau2').addEventListener('click', function () {
            if (!selectedFile) {
                alert("Vui lòng chọn một file Excel trước.");
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(sheet);
                    
                    if (jsonData.length === 0) {
                        alert("File Excel không có dữ liệu hoặc không đúng định dạng.");
                        return;
                    }
                    
                    const row = jsonData[0];
                    let filledFields = 0;
                    
                    scoreFields.forEach(field => {
                        const value = row[field.key];
                        if (value !== undefined && value !== null && value !== '') {
                            document.getElementById(field.id).value = value;
                            filledFields++;
                        }
                    });
                    
                    alert("Dữ liệu đã được đọc thành công! " + filledFields + " trường đã được điền.");
                } catch (error) {
                    console.error("Lỗi khi đọc file:", error);
                    alert("Có lỗi xảy ra khi đọc file: " + error.message);
                }
            };
            
            reader.onerror = function (e) {
                console.error("Lỗi FileReader:", e);
                alert("Lỗi khi đọc file. Vui lòng thử lại.");
            };
            
            reader.readAsArrayBuffer(selectedFile);
        });

        // Hàm cập nhật biểu đồ năng lực
        function updateAbilityChart(subjects, scores) {
            const ctx = document.getElementById('abilityChart').getContext('2d');
            
            if (abilityChart) {
                abilityChart.destroy();
            }
            
            abilityChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: subjects,
                    datasets: [{
                        label: 'Năng lực học tập',
                        data: scores,
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(54, 162, 235, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(54, 162, 235, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: {
                                display: true
                            },
                            suggestedMin: 0,
                            suggestedMax: 10,
                            ticks: {
                                stepSize: 2
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: 'BIỂU ĐỒ ĐÁNH GIÁ NĂNG LỰC HỌC TẬP'
                        }
                    }
                }
            });
        }
        
        // Xử lý tư vấn tổ hợp
        document.getElementById("tuvan").onclick = function() {
            let van6 = parseFloat(document.getElementById('van6').value) || 0;
            let van7 = parseFloat(document.getElementById('van7').value) || 0;
            let van8 = parseFloat(document.getElementById('van8').value) || 0;
            let van9 = parseFloat(document.getElementById('van9').value) || 0;
            let toan6 = parseFloat(document.getElementById('toan6').value) || 0;
            let toan7 = parseFloat(document.getElementById('toan7').value) || 0;
            let toan8 = parseFloat(document.getElementById('toan8').value) || 0;
            let toan9 = parseFloat(document.getElementById('toan9').value) || 0;
            let anh6 = parseFloat(document.getElementById('anh6').value) || 0;
            let anh7 = parseFloat(document.getElementById('anh7').value) || 0;
            let anh8 = parseFloat(document.getElementById('anh8').value) || 0;
            let anh9 = parseFloat(document.getElementById('anh9').value) || 0;
            let gdcd6 = parseFloat(document.getElementById('gdcd6').value) || 0;
            let gdcd7 = parseFloat(document.getElementById('gdcd7').value) || 0
